name: tests

# Unit tests only. They use made-up data and need nothing from the
# maintainer's machine. The privacy check (tools/privacy_check.py) stays a
# local git hook: it compares changes against the committer's own user name,
# paths and the player names in their local CS2 logs, none of which exist
# here -- and a CI log on a public repository is public.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install what the tests import
        run: python -m pip install pytest numpy PySide6 requests
      - name: Run the tests
        run: python -m pytest -q tests
